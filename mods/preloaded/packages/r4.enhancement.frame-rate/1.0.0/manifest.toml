format_version = 7
id = "r4.enhancement.frame-rate"
version = "1.0.0"
name = "R4 Frame Rate"
author = "Shokunin"
description = "Redraws intermediate race frames while preserving the original game logic."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00797"

[[feature]]
id = "frame-rate"
name = "Race frame rate"
description = "Extra race frames; 60 FPS on by default. Choose a presentation rate or follow the display refresh. Extra frames redraw geometry; logic, input and audio keep their original timing. Auto is 60 FPS, or the original 30 FPS at an 8K (18x) internal resolution. 30 FPS shows the original frames only."
group = "Display"
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Presentation rate"
group = "Display"
type = "choice"
default = "60"

[[option.choice]]
value = "auto"
label = "Auto (60 FPS; 30 at 8K)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "display"
label = "Match display refresh"

[[option.choice]]
value = "30"
label = "30 FPS (original)"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "100"
label = "100 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[plugin]]
feature = "frame-rate"
id = "r4.framerate"
netplay = "local_view"
