format_version = 6
id = "r4.enhancement.frame-rate"
version = "1.0.0"
name = "R4 Frame Rate"
author = "Shokunin"
description = "Presents R4 at a higher frame rate while the game itself keeps its stock 30 Hz race logic, timers and audio."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# The interpolation plugin calls US EXE functions by address. SLUS-00797 has
# one release (DISC.md), this runtime is compiled from that exact boot EXE and
# its text-image guard checks the loaded image, so game_id is the pin. No
# exe_sha256: a release install carries no loose EXE for psxrecomp to hash,
# and the target would never match there, refusing to launch while the
# package is on (it is on by default).
[[target]]
game_id = "SLUS-00797"

[[feature]]
id = "frame-rate"
name = "R4 Frame Rate"
description = "On by default. Races get extra frames between the game's own, drawn only in time the game leaves free, so it never runs slower: where none fits, the game's own 30 FPS frame is shown as is. Game logic, lap times, AI, input and music stay at the stock 30 Hz. Turn it off for the stock 30 FPS picture. Requires OpenGL; vsync is off while it runs."
group = "Frame Rate"
# On by default for R4 (owner decision, 2026-10-01). A player's own choice
# in the launcher is saved to mods/state.toml and always wins.
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Presentation rate"
description = "Display refresh follows the monitor and gives the most even motion. Fixed rates are for high-refresh or variable-refresh displays. Unlimited draws as many in-between frames as fit and shows each one at its own time, beyond the refresh rate if the computer is fast enough (vsync off: a monitor still shows at most its refresh rate, and without a desktop compositor, as in exclusive fullscreen on Windows, extra frames can tear). Any rate only uses time the game leaves free."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "100"
label = "100 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "200"
label = "200 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[option.choice]]
value = "300"
label = "300 FPS"

[[option.choice]]
value = "unlimited"
label = "Unlimited (as many as fit, vsync off)"

[[option]]
feature = "frame-rate"
id = "method"
label = "Method"
description = "Interpolated redraws the race between game frames with cars and camera placed in between, in time the game leaves free: really smooth motion, no latency added, and where no in-between frame fits, the game's own frame unchanged. Frame blend crossfades finished frames instead, at every frame: cheaper, but it ghosts and shows each frame one game frame later."
group = "Frame Rate"
type = "choice"
default = "interpolate"

[[option.choice]]
value = "interpolate"
label = "Interpolated (smooth motion, no added latency)"

[[option.choice]]
value = "blend"
label = "Frame blend"

[[option]]
feature = "frame-rate"
id = "blend"
label = "Blend style"
description = "For Frame blend. Smooth crossfades the whole frame; Sharp keeps still areas blended but switches fast-moving areas at the halfway point."
group = "Frame Rate"
type = "choice"
default = "smooth"

[[option.choice]]
value = "smooth"
label = "Smooth"

[[option.choice]]
value = "sharp"
label = "Sharp"

[[plugin]]
feature = "frame-rate"
id = "r4.framerate"
